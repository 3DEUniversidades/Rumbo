services:
  postgres:
    image: postgres:18
    container_name: rumbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocacional_db}
      POSTGRES_USER: ${POSTGRES_USER:-rumbo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rumbo_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - rumbo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rumbo_app} -d ${POSTGRES_DB:-vocacional_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rumbo_postgres_data:
