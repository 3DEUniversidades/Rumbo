# Alternativa local sin PostgreSQL. Los datos se pierden al detener la aplicacion.
spring.datasource.url=jdbc:h2:mem:rumbo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# data.sql contiene instrucciones exclusivas de PostgreSQL.
spring.sql.init.mode=never
