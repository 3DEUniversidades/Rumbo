# Copy this file to src/main/resources/application-local.properties
# and adjust values for your own local PostgreSQL installation.
# Do not commit application-local.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/vocacional_db
spring.datasource.username=rumbo_app
spring.datasource.password=rumbo_app_dev

# Prototype mode: JPA updates the schema while the model is still changing.
# For production/deployment this should become validate or be handled by migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Set to always only when data.sql exists and you intentionally want to seed data.
spring.sql.init.mode=never
