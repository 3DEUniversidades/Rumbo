<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Rumbo - Iniciar sesion">
    <link rel="manifest" href="/manifest.json">
    <title>Rumbo - Iniciar sesion</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Rumbo</h1>
        <p>Tu guia de orientacion vocacional</p>
    </header>

    <main>
        <section id="login">
            <h2>Iniciar sesion</h2>
            <form id="login-form" class="login-form">
                <label for="correo">Correo electronico</label>
                <input type="email" id="correo" name="correo" required autocomplete="email">

                <label for="contrasenia">Contrasena</label>
                <input type="password" id="contrasenia" name="contrasenia" required autocomplete="current-password">

                <button type="submit" class="btn">Ingresar</button>

                <p id="mensaje-error" class="mensaje-error"></p>
                <p id="mensaje-exito" class="mensaje-exito"></p>
            </form>
            <p class="cambio-vista">¿No tienes cuenta? <a href="#" id="ir-a-registro">Registrate</a></p>
        </section>

        <section id="registro" hidden>
            <h2>Crear cuenta</h2>
            <form id="registro-form" class="login-form" novalidate>
                <label for="registro-nombreUsuario">Nombre de usuario</label>
                <input type="text" id="registro-nombreUsuario" name="nombreUsuario" required autocomplete="username">
                <span class="campo-error" data-campo="nombreUsuario"></span>

                <label for="registro-nombreCompleto">Nombre completo</label>
                <input type="text" id="registro-nombreCompleto" name="nombreCompleto" required autocomplete="name">
                <span class="campo-error" data-campo="nombreCompleto"></span>

                <label for="registro-correo">Correo electronico</label>
                <input type="email" id="registro-correo" name="correo" required autocomplete="email">
                <span class="campo-error" data-campo="correo"></span>

                <label for="registro-contrasenia">Contrasena</label>
                <input type="password" id="registro-contrasenia" name="contrasenia" required minlength="8" autocomplete="new-password">
                <span class="campo-error" data-campo="contrasenia"></span>

                <label for="registro-rol">Rol</label>
                <select id="registro-rol" name="rol" required>
                    <option value="" selected disabled>Selecciona un rol</option>
                    <option value="ESTUDIANTE">Estudiante</option>
                    <option value="COLABORADOR">Colaborador</option>
                </select>
                <span class="campo-error" data-campo="rol"></span>

                <button type="submit" class="btn">Registrarme</button>

                <p id="registro-error" class="mensaje-error"></p>
                <p id="registro-exito" class="mensaje-exito"></p>
            </form>
            <p class="cambio-vista">¿Ya tienes cuenta? <a href="#" id="ir-a-login">Inicia sesion</a></p>
        </section>
    </main>

    <footer>
        <p>Rumbo &copy; 2026</p>
    </footer>

    <script src="/js/vistaAutenticacion.js?v=2"></script>
</body>
</html>
