<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Rumbo - Iniciar sesion">
    <link rel="manifest" href="/manifest.json">
    <title>Rumbo - Iniciar sesion</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Rumbo</h1>
        <p>Tu guia de orientacion vocacional</p>
    </header>

    <main>
        <section id="login">
            <h2>Iniciar sesion</h2>
            <form id="login-form" class="login-form">
                <label for="correo">Correo electronico</label>
                <input type="email" id="correo" name="correo" required autocomplete="email">

                <label for="contrasenia">Contrasena</label>
                <input type="password" id="contrasenia" name="contrasenia" required autocomplete="current-password">

                <button type="submit" class="btn">Ingresar</button>

                <p id="mensaje-error" class="mensaje-error"></p>
                <p id="mensaje-exito" class="mensaje-exito"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Rumbo &copy; 2026</p>
    </footer>

    <script src="/js/vistaAutenticacion.js"></script>
</body>
</html>
