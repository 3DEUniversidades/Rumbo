<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="Rumbo - Inicio">
    <link rel="manifest" href="/manifest.json">
    <title>Rumbo - Inicio</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#rumbo-contenido">Saltar al contenido</a>

    <header>
        <h1>Rumbo</h1>
        <p>Tu guía de orientación vocacional</p>
    <nav class="rumbo-nav" aria-label="Ubicación"><a href="/inicio.html">Inicio</a><span aria-current="page">Inicio</span></nav>
    </header>

    <div id="rumbo-contenido" tabindex="-1"></div>
    <main id="contenido-principal">
        <section id="bienvenida">
            <h2 id="saludo">Hola</h2>
            <p class="texto-secundario">Elige hacia dónde quieres continuar tu proceso.</p>
        </section>

        <section id="acciones" hidden>
            <a id="enlace-panel-rol" href="/inicio.html"
               class="btn btn-secundario">
                Mi panel
            </a>

            <a href="/carreras.html" class="btn">
                Ver carreras
            </a>

            <a href="/comparador-carreras.html" class="btn btn-secundario">
                Comparar carreras
            </a>

            <a id="enlace-perfil" href="/perfil.html"
               class="btn btn-secundario" hidden>
                Mi perfil
            </a>

            <a id="enlace-linea-tiempo" href="/linea-tiempo.html"
               class="btn btn-secundario" hidden>
                Mi línea de tiempo
            </a>

            <a id="enlace-foro" href="/foro.html"
               class="btn btn-secundario" hidden>
                Entrar al foro
            </a>

            <a id="enlace-gestion-carreras" href="/gestion-carreras.html"
               class="btn btn-secundario" hidden>
                Gestionar carreras
            </a>
        </section>

        <section id="verificacion-estudiante" hidden>
            <h2>Verificación de mi cuenta</h2>
            <p id="mensaje-verificacion" role="status"></p>

            <button id="solicitar-verificacion" class="btn" type="button">
                Solicitar verificación
            </button>
        </section>
    </main>

    <footer>
        <p>Rumbo &copy; 2026</p>
    </footer>

    <script src="/js/sesion.js"></script>
    <script src="/js/vistaInicio.js"></script>
    <script src="/js/vistaVerificacion.js"></script>
</body>
</html>
