<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css?v=t09-3">
    <title>Rumbo - Mi línea de tiempo</title>
</head>
<body>
    <header>
        <h1>Rumbo</h1>
        <p>Mi proceso de orientación vocacional</p>
    </header>

    <main>
        <a href="/inicio.html" class="btn btn-secundario">
            Volver al inicio
        </a>

        <section aria-labelledby="titulo-progreso">
            <h2 id="titulo-progreso">Mi progreso</h2>

            <label for="barra-progreso">Actividades completadas</label>
            <progress id="barra-progreso" max="100" value="0"></progress>

            <p id="resumen-progreso" role="status">
                Cargando progreso...
            </p>
        </section>

        <section aria-labelledby="titulo-actividades">
            <h2 id="titulo-actividades">Mis actividades</h2>

            <p id="mensaje-linea-tiempo" role="status"></p>

            <button id="reintentar-carga" class="btn" type="button" hidden>
                Reintentar
            </button>

            <div id="lista-actividades"></div>
        </section>
    </main>

    <footer>
        <p>Rumbo &copy; 2026</p>
    </footer>

    <script src="/js/sesion.js"></script>
    <script src="/js/vistaLineaDeTiempo.js?v=t09-5"></script>
</body>
</html>
