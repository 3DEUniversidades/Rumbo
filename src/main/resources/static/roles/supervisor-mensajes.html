<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Rumbo - Supervisión de mensajes</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#rumbo-contenido">Saltar al contenido</a>

    <header>
        <h1>Rumbo</h1>
        <p>Supervisión de mensajes</p>
    <nav class="rumbo-nav" aria-label="Ubicación"><a href="/inicio.html">Inicio</a><span aria-current="page">Supervisión de mensajes</span></nav>
    </header>

    <p id="estado-acceso-supervision" role="status">
        Comprobando acceso...
    </p>

    <div id="rumbo-contenido" tabindex="-1"></div>
    <main id="panel-supervision" class="main-ancho" hidden>
        <div class="vista-encabezado">
            <div>
                <h2 id="nombre-supervisor"></h2>
                <p class="texto-secundario">Supervisor de mensajes</p>
            </div>
            <div>
                <a href="/inicio.html" class="btn btn-secundario">
                    Ir al inicio
                </a>
                <button id="cerrar-sesion" class="btn" type="button">
                    Cerrar sesión
                </button>
            </div>
        </div>

        <p id="mensaje-supervision" role="status"
           aria-live="polite"></p>

        <section>
            <div class="vista-encabezado">
                <div>
                    <h2>Publicaciones pendientes</h2>
                    <p class="texto-secundario">
                        Las publicaciones más recientes aparecen primero.
                    </p>
                </div>
                <button id="actualizar-supervision"
                        class="btn btn-secundario" type="button">
                    Actualizar tablero
                </button>
            </div>

            <p id="estado-pendientes" class="estado-vista"
               role="status"></p>

            <div id="lista-pendientes" class="lista-carreras"></div>
        </section>

        <section>
            <h2>Mis revisiones</h2>
            <p id="estado-revisiones" class="estado-vista"></p>

            <div class="tabla-contenedor" role="region" aria-label="Tabla de supervisión de mensajes" tabindex="0">
                <table id="tabla-revisiones" class="tabla-gestion" hidden>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Publicación</th>
                            <th>Decisión</th>
                            <th>Supervisor</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-revisiones"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer><p>Rumbo &copy; 2026</p></footer>

    <script src="/js/sesion.js"></script>
    <script src="/js/vistaSupervisionMensajes.js?v=3"></script>
</body>
</html>
