spring.application.name=Rumbo

# Carga local opcional de credenciales desde .env (ignorado por Git)
spring.config.import=optional:file:.env[.properties]

# Dominio institucional de la UVG para validar el correo de los colaboradores (RF-04, RF-16)
rumbo.correo.dominio-institucional=uvg.edu.gt

# PostgreSQL es la base predeterminada del equipo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vocacional_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:rumbo_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false

# Datos iniciales de PostgreSQL, despues de preparar el esquema con JPA.
spring.sql.init.mode=${DB_SQL_INIT_MODE:always}
spring.sql.init.data-locations=classpath:data.sql,classpath:data-desarrollo.sql
spring.sql.init.encoding=UTF-8

# Archivos: fotos de perfil y adjuntos de bitacora
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Cloudinary (credenciales por variables de entorno; nunca en el repositorio)
rumbo.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
rumbo.cloudinary.api-key=${CLOUDINARY_API_KEY:}
rumbo.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
rumbo.cloudinary.carpeta-base=rumbo

server.port=${PORT:8081}
