spring.application.name=Rumbo

# Carga local opcional de credenciales desde .env (ignorado por Git)
spring.config.import=optional:file:.env[.properties]

# Dominio institucional de la UVG para validar el correo de los colaboradores (RF-04, RF-16)
rumbo.correo.dominio-institucional=uvg.edu.gt

# Default: H2 for local dev (no PostgreSQL needed to run locally)
spring.datasource.url=jdbc:h2:mem:rumbo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=never

# Archivos: fotos de perfil y adjuntos de bitacora
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Cloudinary (credenciales por variables de entorno; nunca en el repositorio)
rumbo.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
rumbo.cloudinary.api-key=${CLOUDINARY_API_KEY:}
rumbo.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
rumbo.cloudinary.carpeta-base=rumbo

server.port=8081