# Perfil de la demo publica. Docker lo activa por defecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# Primer despliegue: DB_SQL_INIT_MODE=always. Despues: never.
# No cargar data-desarrollo.sql ni su cuenta administradora de ejemplo.
spring.sql.init.mode=${DB_SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8

server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never

rumbo.admin-inicial.correo=${RUMBO_ADMIN_CORREO:}
rumbo.admin-inicial.contrasenia=${RUMBO_ADMIN_CONTRASENIA:}
rumbo.admin-inicial.usuario=${RUMBO_ADMIN_USUARIO:administrador}
